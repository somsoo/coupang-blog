name: Fix Existing Posts (One-time)

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: pip install google-genai requests

    - name: Run fix script
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: python fix_existing_posts.py

    - name: Commit and Push fixed posts
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add _posts/
        git commit -m "Fix: 기존 포스팅 색상 강조박스 및 Pollinations 이미지 일괄 적용" || exit 0
        git push
